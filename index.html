<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant</title>
<meta name="description" content="">
<meta property="og:type" content="restaurant">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  /* Les couleurs et polices sont remplacées par celles de CONFIG.style (plus bas). */
  --primary:#1F6B4A; --accent:#E9A21B; --promo:#C8432B;
  --bg:#FBF5EA; --card:#FFFFFF; --ink:#22231E; --muted:#6A6455; --line:#E6DCCB;
  --font-titre:"Fraunces",Georgia,serif; --font-texte:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-texte);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--font-titre);line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:0;border-radius:999px;padding:12px 22px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}
.btn.alt{background:var(--accent);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}

.promo{background:var(--promo);color:#fff;text-align:center;font-weight:800;padding:9px 16px;font-size:15px}
header{position:sticky;top:0;z-index:5;background:rgba(251,245,234,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:20px;padding:12px 0;flex-wrap:wrap}
.logo{font-family:var(--font-titre);font-size:27px;font-weight:700;color:var(--primary);text-decoration:none}
.nav nav{display:flex;gap:18px;font-weight:700;font-size:15px}
.nav nav a{text-decoration:none}
.nav .sp{flex:1}

.hero{position:relative;min-height:min(78vh,620px);display:grid;align-items:end;overflow:hidden;background:linear-gradient(120deg,var(--primary),var(--accent))}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.55))}
.hero-in{position:relative;z-index:1;color:#fff;padding:40px 0 48px}
.hero .tag{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px;opacity:.95}
.hero h1{font-size:clamp(36px,6vw,64px);max-width:720px;margin:10px 0 12px}
.hero p{max-width:560px;font-size:18px;opacity:.95}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}

section{padding:56px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-head h2{font-size:clamp(30px,4vw,42px)}
.sub{color:var(--muted)}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.dish{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.dish .ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--primary),var(--accent));position:relative}
.dish .ph img{width:100%;height:100%;object-fit:cover;display:block}
.dish-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.dish-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dish h3{font-size:21px}
.price{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);font-weight:600;margin-right:6px}
.desc{color:var(--muted);font-size:14.5px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:12px;font-weight:800;border-radius:6px;padding:1px 8px;background:var(--bg);border:1px solid var(--line)}
.badge.hot{background:var(--promo);color:#fff;border-color:var(--promo)}
.list .dish{flex-direction:row}
.note{margin-top:16px;font-size:14px;color:var(--muted)}

.resa{background:var(--primary);color:#fff;border-radius:22px;padding:32px;display:grid;grid-template-columns:1fr 1.2fr;gap:28px}
.resa h2{font-size:36px;margin-bottom:8px}
.resa .sub{color:rgba(255,255,255,.85)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label{display:block;font-size:13px;font-weight:800;margin-bottom:4px}
.form input,.form select,.form textarea{width:100%;border:0;border-radius:10px;padding:11px 12px;font:inherit;color:var(--ink);background:#fff}
.form .full{grid-column:1/-1}
.form .btn{background:var(--accent);color:var(--ink);justify-content:center}
.msg{grid-column:1/-1;font-weight:700;min-height:1.4em}

.infos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.card h3{font-size:24px;margin-bottom:10px}
.hours{width:100%;border-collapse:collapse}
.hours td{padding:7px 0;border-bottom:1px dotted var(--line)}
.hours td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.hours tr.today td{font-weight:800;color:var(--primary)}
.links{display:flex;flex-direction:column;gap:8px;margin-top:12px}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between}

@media (max-width:760px){
  .nav nav{display:none}
  .resa{grid-template-columns:1fr;padding:24px}
  .form{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="promo" id="promo" hidden></div>
<header><div class="wrap nav">
  <a class="logo" href="#" id="logo"></a>
  <nav aria-label="Menu"><a href="#carte">La carte</a><a href="#reserver">Réserver</a><a href="#infos">Infos</a></nav>
  <span class="sp"></span>
  <a class="btn" href="#reserver">Réserver</a>
</div></header>

<div class="hero" id="hero"><div class="wrap hero-in">
  <div class="tag" id="h-tag"></div>
  <h1 id="h-titre"></h1>
  <p id="h-texte"></p>
  <div class="row"><a class="btn alt" href="#reserver">Réserver une table</a><a class="btn ghost" style="color:#fff;border-color:#fff" href="#carte">Voir la carte</a></div>
</div></div>

<section id="carte"><div class="wrap">
  <div class="sec-head"><div><h2>La carte</h2><p class="sub" id="carte-sub"></p></div></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="dishes" id="dishes"></div>
  <p class="note" id="carte-note"></p>
</div></section>

<section id="reserver"><div class="wrap">
  <div class="resa">
    <div><h2>Réserver une table</h2><p class="sub" id="resa-sub"></p><p class="sub" style="margin-top:14px" id="resa-tel"></p></div>
    <form class="form" id="form" novalidate>
      <div><label for="f-nom">Nom</label><input id="f-nom" required autocomplete="name"></div>
      <div><label for="f-tel">Téléphone</label><input id="f-tel" type="tel" required autocomplete="tel"></div>
      <div><label for="f-date">Date</label><input id="f-date" type="date" required></div>
      <div><label for="f-heure">Heure</label><input id="f-heure" type="time" required step="900"></div>
      <div><label for="f-pers">Personnes</label><input id="f-pers" type="number" min="1" max="100" value="2" required></div>
      <div><label for="f-occ">Occasion</label><select id="f-occ"><option>Repas</option><option>Anniversaire</option><option>Groupe / afterwork</option><option>Repas d'affaires</option></select></div>
      <div class="full"><label for="f-msg">Message (allergies, demande…)</label><textarea id="f-msg" rows="2"></textarea></div>
      <button class="btn full" type="submit" id="f-btn">Envoyer ma demande</button>
      <p class="msg" id="f-out" role="status"></p>
    </form>
  </div>
</div></section>

<section id="infos"><div class="wrap">
  <div class="infos">
    <div class="card"><h3>Horaires</h3><table class="hours"><tbody id="hours"></tbody></table></div>
    <div class="card"><h3>Nous trouver</h3><p id="adresse"></p><p class="sub" style="margin-top:6px" id="acces"></p><div class="links" id="links"></div></div>
  </div>
</div></section>

<footer><div class="wrap"><span id="f-left"></span><span>Site réalisé par FoodLab · @foodlab.var</span></div></footer>

<script>
/* =====================================================================
   MODÈLE DE SITE FOODLAB
   Pour chaque restaurant : dupliquez le dossier, modifiez seulement
   CONFIG ci-dessous et mettez les photos dans le dossier photos/.
   ===================================================================== */
const CONFIG={
  // Identifiant du Google Sheets du restaurant (la partie entre /d/ et /edit dans son lien).
  // Le tableau doit être partagé en « Tous les utilisateurs disposant du lien : lecteur ».
  // Laisser vide pour utiliser seulement les valeurs ci-dessous.
  googleSheet:"1WMd2fxq4cAGeeE-63TURz_eU-1LF2q45BU9iXU89jPE",

  nom:"La Table d'Exemple",                 // nom du restaurant
  slogan:"Cuisine maison et produits du marché, au cœur de Toulon.",
  categorie:"Cuisine maison · Toulon",
  description:"Restaurant à Toulon : cuisine maison, carte qui change chaque semaine, réservation en ligne.",
  photoAccueil:"photos/accueil.jpg",

  style:{ // couleurs et polices choisies avec le restaurant
    principale:"#1F6B4A", accent:"#E9A21B", promo:"#C8432B", fond:"#FBF5EA",
    policeTitre:"Fraunces", policeTexte:"Nunito"
  },

  promo:{ active:true, texte:"Ce mois-ci : formule du midi plat + dessert à 15 €" },

  carte:{
    "Entrées":[
      {nom:"Samoussas maison",desc:"Légumes ou viande, croustillants",prix:6,photo:"photos/samoussas.jpg",badges:["Fait maison"]},
      {nom:"Achards de légumes",desc:"Légumes croquants au curcuma",prix:5,photo:"photos/achards.jpg",badges:["Végétarien"]}
    ],
    "Plats":[
      {nom:"Rougail saucisses",desc:"Mijoté à la tomate, servi avec riz",prix:16,photo:"photos/rougail.jpg",badges:["Le plus commandé"],chaud:true},
      {nom:"Mixao aux légumes",desc:"Nouilles sautées",prix:14,ancienPrix:16,photo:"photos/mixao.jpg",badges:["Promo"]}
    ],
    "Desserts":[
      {nom:"Gâteau coco",desc:"Moelleux, à la noix de coco",prix:6,photo:"photos/coco.jpg"}
    ],
    "Boissons":[
      {nom:"Rhum arrangé maison",desc:"Plusieurs parfums",prix:5,photo:"photos/rhum.jpg"},
      {nom:"Jus de fruits exotiques",desc:"Selon la saison",prix:4}
    ]
  },
  noteCarte:"Prix nets en euros, service compris. Liste des allergènes sur demande.",

  // Réservation : "whatsapp" ouvre WhatsApp avec le message déjà rempli ;
  // "formulaire" envoie à un service de formulaire (Formspree, Tally…) dont on colle l'adresse.
  reservation:{ mode:"whatsapp", whatsapp:"33600000000", adresseFormulaire:"",
    texte:"Remplissez le formulaire : la demande nous arrive directement et nous vous confirmons rapidement." },

  telephone:"04 00 00 00 00",
  adresse:"1 rue d'Exemple, 83000 Toulon",
  acces:"À deux pas des Halles. Terrasse aux beaux jours.",
  horaires:[ // de lundi à dimanche
    ["Lundi","11h – 15h"],["Mardi","Fermé"],["Mercredi","Fermé"],["Jeudi","11h – 23h"],
    ["Vendredi","11h – 23h"],["Samedi","11h – 23h"],["Dimanche","11h – 15h"]
  ],
  reseaux:{ instagram:"", facebook:"", tiktok:"" } // ex. "https://instagram.com/compte"
};

/* ---------- Le reste n'a pas besoin d'être modifié ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const C=CONFIG, euro=n=>(Number.isInteger(n)?n:n.toFixed(2).replace(".",","))+" €";

// Style
const st=document.documentElement.style;
st.setProperty("--primary",C.style.principale); st.setProperty("--accent",C.style.accent);
st.setProperty("--promo",C.style.promo); st.setProperty("--bg",C.style.fond);
st.setProperty("--font-titre",'"'+C.style.policeTitre+'",Georgia,serif');
st.setProperty("--font-texte",'"'+C.style.policeTexte+'","Segoe UI",system-ui,sans-serif');
$("fonts").href="https://fonts.googleapis.com/css2?family="+encodeURIComponent(C.style.policeTitre)+":wght@600;700&family="+encodeURIComponent(C.style.policeTexte)+":wght@400;600;700;800&display=swap";

// Référencement
document.title=C.nom+" · "+C.categorie;
document.querySelector('meta[name="description"]').content=C.description;
const ld={"@context":"https://schema.org","@type":"Restaurant",name:C.nom,description:C.description,telephone:C.telephone,address:C.adresse,servesCuisine:C.categorie,url:location.href};
const s=document.createElement("script"); s.type="application/ld+json"; s.textContent=JSON.stringify(ld); document.head.appendChild(s);

// Contenu
function renderAll(){
$("promo").hidden=!C.promo.active;
if(C.promo.active){ $("promo").hidden=false; $("promo").textContent=C.promo.texte; }
$("logo").textContent=C.nom; $("h-tag").textContent=C.categorie; $("h-titre").textContent=C.nom; $("h-texte").textContent=C.slogan;
if(C.photoAccueil && !$("hero").querySelector("img")){ const im=new Image(); im.alt=""; im.src=C.photoAccueil; im.onerror=()=>im.remove(); $("hero").prepend(im); }
document.title=C.nom+" · "+C.categorie;
$("carte-sub").textContent="Tout est fait maison."; $("carte-note").textContent=C.noteCarte;

if(!C.carte[tab]) tab=Object.keys(C.carte)[0];
renderCarte();
const today=(new Date().getDay()+6)%7;
$("hours").innerHTML=C.horaires.map((h,i)=>'<tr'+(i===today?' class="today"':'')+'><td>'+esc(h[0])+(i===today?' (aujourd\'hui)':'')+'</td><td>'+esc(h[1])+'</td></tr>').join("");
$("adresse").textContent=C.adresse; $("acces").textContent=C.acces;
const maps="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(C.nom+" "+C.adresse);
const links=[['Itinéraire Google Maps',maps],['Appeler : '+C.telephone,'tel:'+C.telephone.replace(/\s/g,"")]];
Object.entries(C.reseaux).forEach(([k,v])=>{ if(v) links.push([k.charAt(0).toUpperCase()+k.slice(1),v]); });
$("links").innerHTML=links.map(l=>'<a href="'+esc(l[1])+'">'+esc(l[0])+'</a>').join("");
$("resa-sub").textContent=C.reservation.texte; $("resa-tel").textContent="Pour un groupe ou une question : "+C.telephone;
$("f-left").textContent=C.nom+" · "+C.adresse;
}
let tab=Object.keys(C.carte)[0];
function renderCarte(){
  $("tabs").innerHTML=Object.keys(C.carte).map(k=>'<button class="tab" type="button" role="tab" aria-selected="'+(k===tab)+'" data-tab="'+esc(k)+'">'+esc(k)+'</button>').join("");
  $("dishes").innerHTML=C.carte[tab].map(d=>'<article class="dish"><div class="ph">'+(d.photo?'<img src="'+esc(d.photo)+'" alt="'+esc(d.nom)+'" loading="lazy" onerror="this.remove()">':'')+'</div>'+
    '<div class="dish-b"><div class="dish-top"><h3>'+esc(d.nom)+'</h3><span class="price">'+(d.ancienPrix?'<s>'+euro(d.ancienPrix)+'</s>':'')+euro(d.prix)+'</span></div>'+
    (d.desc?'<p class="desc">'+esc(d.desc)+'</p>':'')+
    ((d.badges&&d.badges.length)?'<div class="badges">'+d.badges.map(b=>'<span class="badge'+(/promo|plus command/i.test(b)?' hot':'')+'">'+esc(b)+'</span>').join("")+'</div>':'')+'</div></article>').join("");
}
document.addEventListener("click",e=>{ const t=e.target.closest("[data-tab]"); if(t){ tab=t.dataset.tab; renderCarte(); } });
renderAll();

/* ---------- Lecture du Google Sheets ---------- */
function parseCSV(t){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cur); cur=""; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; } else if(c!=='\r') cur+=c; }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
const num=v=>{ const x=parseFloat(String(v||"").replace(/[^\d,.-]/g,"").replace(",",".")); return isNaN(x)?null:x; };
async function lireOnglet(nom){
  const url="https://docs.google.com/spreadsheets/d/"+C.googleSheet+"/gviz/tq?tqx=out:csv&headers=1&sheet="+encodeURIComponent(nom)+"&t="+Date.now();
  const r=await fetch(url); if(!r.ok) throw new Error(nom);
  return parseCSV(await r.text()).slice(1);
}
async function chargerSheet(){
  if(!C.googleSheet) return;
  try{
    const [carte,infos]=await Promise.all([lireOnglet("Carte"),lireOnglet("Infos")]);
    const nc={};
    carte.forEach(r=>{ const [cat,nom,desc,prix,ancien,photo,badges,aff]=r.map(x=>(x||"").trim());
      if(!cat||!nom||/^non$/i.test(aff)) return;
      (nc[cat]=nc[cat]||[]).push({nom,desc,prix:num(prix)||0,ancienPrix:num(ancien),photo,badges:badges?badges.split(/\s*[,;]\s*/):[]}); });
    if(Object.keys(nc).length) C.carte=nc;
    const I={}; infos.forEach(r=>{ if(r[0]) I[r[0].trim().toLowerCase()]=(r[1]||"").trim(); });
    const g=k=>I[k];
    if(g("nom")) C.nom=g("nom"); if(g("slogan")) C.slogan=g("slogan"); if(g("catégorie")) C.categorie=g("catégorie");
    if(g("promo active")!==undefined) C.promo.active=/^oui$/i.test(g("promo active"));
    if(g("texte de la promo")) C.promo.texte=g("texte de la promo");
    if(g("téléphone")) C.telephone=g("téléphone"); if(g("whatsapp")) C.reservation.whatsapp=g("whatsapp").replace(/\D/g,"");
    if(g("adresse")) C.adresse=g("adresse"); if(g("accès")!==undefined) C.acces=g("accès");
    const jours=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
    if(jours.some(j=>g(j.toLowerCase()))) C.horaires=jours.map(j=>[j,g(j.toLowerCase())||"Fermé"]);
    ["instagram","facebook","tiktok"].forEach(k=>{ if(g(k)!==undefined) C.reseaux[k]=g(k); });
    renderAll();
  }catch(e){ /* le tableau n'est pas joignable : on garde les valeurs de CONFIG */ }
}
chargerSheet();
const d0=new Date(); $("f-date").min=d0.toISOString().slice(0,10);

// Réservation
$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const f=e.target, out=$("f-out");
  if(!f.checkValidity()){ out.textContent="Merci de remplir le nom, le téléphone, la date, l'heure et le nombre de personnes."; return; }
  const v=id=>$(id).value.trim();
  const dateTxt=new Date(v("f-date")+"T12:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  const texte="Bonjour, je souhaite réserver chez "+C.nom+" :\n- "+dateTxt+" à "+v("f-heure")+"\n- "+v("f-pers")+" personne(s)\n- Occasion : "+v("f-occ")+"\n- Nom : "+v("f-nom")+"\n- Téléphone : "+v("f-tel")+(v("f-msg")?"\n- Message : "+v("f-msg"):"");
  if(C.reservation.mode==="formulaire" && C.reservation.adresseFormulaire){
    $("f-btn").disabled=true;
    try{
      const r=await fetch(C.reservation.adresseFormulaire,{method:"POST",headers:{"Accept":"application/json","Content-Type":"application/json"},body:JSON.stringify({nom:v("f-nom"),telephone:v("f-tel"),date:v("f-date"),heure:v("f-heure"),personnes:v("f-pers"),occasion:v("f-occ"),message:v("f-msg")})});
      if(!r.ok) throw 0;
      out.textContent="Merci ! Votre demande est envoyée. Le restaurant vous confirme rapidement."; f.reset();
    }catch(_){ out.textContent="L'envoi n'a pas marché. Appelez-nous au "+C.telephone+"."; }
    $("f-btn").disabled=false;
  }else{
    window.location.href="https://wa.me/"+C.reservation.whatsapp+"?text="+encodeURIComponent(texte);
    out.textContent="WhatsApp s'ouvre avec votre demande : il ne reste qu'à l'envoyer.";
  }
});
</script>
</body>
</html>
